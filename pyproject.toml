[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scaffold"
version = "0.1.0"
description = "An engineering-stable scaffold for building AI agents"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "ddgs>=9.0.0",
]

[project.scripts]
s-agent = "cli.app:main"
s-agent-feishu = "integrations.feishu_bot:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
redis = ["redis>=5.0.0"]
feishu = ["lark-oapi>=1.6.0"]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["agent", "cli", "config", "integrations", "mcp", "tools"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["test"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B007", "B905"]

[tool.mypy]
python_version = "3.10"
files = ["agent", "cli", "config", "integrations", "mcp", "tools", "main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disable_error_code = ["attr-defined", "arg-type"]
