[project]
name = "agent-scaffold"
version = "0.1.0"
description = "An engineering-stable scaffold for building AI agents"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
redis = ["redis>=5.0.0"]
